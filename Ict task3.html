<!DOCTYPE html>
<html>
<head>
    <title>Hotel Form</title>

    <style>
        body {
            background-color: white;
        }

        .container {
            background-color: lightgray;
            border: 15px solid gray;
            border-width: 15px 8px 8px 8px;
            padding: 10px;
            width: fit-content;
            margin: auto;
        }

        h1 {
            color: red;
            text-align: center;
            font-size: 26px;
        }

        table {
            background-color: lightblue;
            border: 2px solid black;
            border-spacing: 2px;
            margin: auto;
        }

        td {
            border: 1px solid gray;
            padding: 5px;
        }

        .label {
            font-weight: bold;
            text-align: right;
        }

        .center {
            text-align: center;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>Continental Hotel Reservation Form</h1>

        <form>
            <table>
                <tr>
                    <td class="label">Name</td>
                    <td>
                        <input type="text" placeholder="Enter your name">
                    </td>
                </tr>

                <tr>
                    <td class="label">eMail</td>
                    <td>
                        <input type="email" value="info@continental.pk">
                    </td>
                </tr>

                <tr>
                    <td class="label">Mobile No</td>
                    <td>
                        <input type="number" placeholder="Enter your cell number">
                    </td>
                </tr>

                <tr>
                    <td class="label">Arrival Time</td>
                    <td>
                        <input type="time" placeholder="Enter your arrival time">
                    </td>
                </tr>

                <tr>
                    <td class="label">Departure</td>
                    <td>
                        <input type="time">
                        <input type="text">
                    </td>
                </tr>

                <tr>
                    <td class="label">Room Type</td>
                    <td>
                        <input type="radio" name="room"> Single
                        <input type="radio" name="room"> Double
                        <br>
                        <input type="radio" name="room"> Presidential Suite
                    </td>
                </tr>

                <tr>
                    <td class="label">Preferences</td>
                    <td>
                        <input type="checkbox"> Non-Smoking
                        <br>
                        <input type="checkbox"> Internet
                        <br>
                        <input type="checkbox"> Firm Mattress
                    </td>
                </tr>

                <tr>
                    <td class="label">Mode of Payment</td>
                    <td>
                        <input type="checkbox"> Cash
                        <input type="checkbox"> Check
                        <br>
                        <input type="checkbox"> Credit Card

                        <select>
                            <option>Select Card</option>
                            <option>Visa</option>
                            <option>MasterCard</option>
                        </select>
                    </td>
                </tr>

                <tr>
                    <td colspan="2" class="center">
                        <input type="submit" value="Send Data">
                    </td>
                </tr>
            </table>
        </form>

    </div>

</body>
</html>
